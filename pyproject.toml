[project]
name = "docs-agent"
version = "0.1.0"
description = "RAG agent with citations over the FastAPI docs (FastAPI + pgvector)"
readme = "README.md"
authors = [
    { name = "Anderson-Palomino", email = "170631001+Anderson-Palomino@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "openai>=3.42.1",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: needs a reachable Postgres (skipped otherwise)",
]
